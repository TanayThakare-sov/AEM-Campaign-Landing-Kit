<section class="hero" style="background-image:url(${properties.image @ context='uri'})" data-track="hero">
  <div class="hero__inner">
    <h1 class="hero__title">${properties.title}</h1>
    <p class="hero__sub">${properties.subtitle}</p>
    <a class="btn" href="${properties.ctaLink @ context='uri'}" data-track="hero-cta">${properties.ctaText}</a>
  </div>
</section>
